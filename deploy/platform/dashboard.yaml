apiVersion: v1
kind: ConfigMap
metadata:
  name: rideshare-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  rideshare.json: |
    {
      "uid": "rideshare",
      "title": "Ride Sharing",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "RPS",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            { "refId": "A", "expr": "sum(rate(http_requests_total[1m]))" }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Error rate",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_requests_total{status=~\"5..\"}[1m])) / clamp_min(sum(rate(http_requests_total[1m])), 1)"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Latency p95",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[1m])))"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Nodes ready",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})"
            }
          ]
        }
      ]
    }