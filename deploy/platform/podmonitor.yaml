apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: rideshare
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - rideshare
  selector:
    matchExpressions:
      - key: app
        operator: Exists
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s