# rideshare-ip is 136.81.121.175. nip.io resolves that name to the same address,
# which is what the Google managed certificate checks. HTTPS stays off until
# the certificate is Active; http://136.81.121.175 works in the meantime.
# Browser geolocation needs the HTTPS name.
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: rideshare-cert
  namespace: rideshare
spec:
  domains:
    - 136.81.121.175.nip.io
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: rideshare-https
  namespace: rideshare
spec:
  redirectToHttps:
    enabled: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ride-request
  namespace: rideshare
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: rideshare-ip
    networking.gke.io/managed-certificates: rideshare-cert
    networking.gke.io/v1beta1.FrontendConfig: rideshare-https
spec:
  ingressClassName: gce
  defaultBackend:
    service:
      name: ride-request
      port:
        number: 8003
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ride-request
                port:
                  number: 8003