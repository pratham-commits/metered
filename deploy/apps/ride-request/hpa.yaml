apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ride-request
  namespace: rideshare
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ride-request
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ride-request-hpa-reader
  namespace: rideshare
rules:
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ride-request-hpa-reader
  namespace: rideshare
subjects:
  - kind: ServiceAccount
    name: ride-request
    namespace: rideshare
roleRef:
  kind: Role
  name: ride-request-hpa-reader
  apiGroup: rbac.authorization.k8s.io