apiVersion: apps/v1
kind: Deployment
metadata:
  name: ride-request
  namespace: rideshare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ride-request
  template:
    metadata:
      labels:
        app: ride-request
      annotations:
        rideshare.io/config-version: "1"
    spec:
      serviceAccountName: ride-request
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: ride-request
          image: asia-south1-docker.pkg.dev/metered-513804/rideshare/ride-request:REPLACE_SHA
          ports:
            - name: http
              containerPort: 8003
          envFrom:
            - secretRef:
                name: rideshare-secret
            - configMapRef:
                name: rideshare-config
          env:
            - name: SERVICE_NAME
              value: ride-request
          volumeMounts:
            - name: kafka-ca
              mountPath: /etc/kafka
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8003
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8003
            initialDelaySeconds: 10
      volumes:
        - name: kafka-ca
          secret:
            secretName: rideshare-kafka-cluster-ca-cert
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: ride-request
  namespace: rideshare
spec:
  selector:
    app: ride-request
  ports:
    - name: http
      port: 8003
      targetPort: 8003
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ride-request
  namespace: rideshare
  annotations:
    iam.gke.io/gcp-service-account: rideshare-ride-request@metered-513804.iam.gserviceaccount.com