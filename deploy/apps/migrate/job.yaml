apiVersion: batch/v1
kind: Job
metadata:
  name: schema-migrate
  namespace: rideshare
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: migrate
          image: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/rideshare/rider:REPLACE_SHA
          command: ["python", "-m", "rideshare.migrate"]
          envFrom:
            - secretRef:
                name: rideshare-secret
            - configMapRef:
                name: rideshare-config
