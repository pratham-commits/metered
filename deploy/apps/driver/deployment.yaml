apiVersion: apps/v1
kind: Deployment
metadata:
  name: driver
  namespace: rideshare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: driver
  template:
    metadata:
      labels:
        app: driver
      annotations:
        rideshare.io/config-version: "1"
    spec:
      serviceAccountName: driver
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: driver
          image: asia-south1-docker.pkg.dev/metered-513804/rideshare/driver:de1067c
          ports:
            - containerPort: 8002
            - containerPort: 9002
          envFrom:
            - secretRef:
                name: rideshare-secret
            - configMapRef:
                name: rideshare-config
          env:
            - name: SERVICE_NAME
              value: driver
          volumeMounts:
            - name: kafka-ca
              mountPath: /etc/kafka
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8002
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8002
            initialDelaySeconds: 10
      volumes:
        - name: kafka-ca
          secret:
            secretName: rideshare-kafka-cluster-ca-cert
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: driver
  namespace: rideshare
spec:
  selector:
    app: driver
  ports:
    - name: http
      port: 8002
      targetPort: 8002
    - name: grpc
      port: 9002
      targetPort: 9002
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: driver
  namespace: rideshare
  annotations:
    iam.gke.io/gcp-service-account: rideshare-driver@metered-513804.iam.gserviceaccount.com
