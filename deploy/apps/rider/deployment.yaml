apiVersion: apps/v1
kind: Deployment
metadata:
  name: rider
  namespace: rideshare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rider
  template:
    metadata:
      labels:
        app: rider
      annotations:
        rideshare.io/config-version: "1"
    spec:
      serviceAccountName: rider
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: rider
          image: asia-south1-docker.pkg.dev/metered-513804/rideshare/rider:517ef2c
          ports:
            - containerPort: 8001
          envFrom:
            - secretRef:
                name: rideshare-secret
            - configMapRef:
                name: rideshare-config
          env:
            - name: SERVICE_NAME
              value: rider
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8001
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rider
  namespace: rideshare
spec:
  selector:
    app: rider
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rider
  namespace: rideshare
  annotations:
    iam.gke.io/gcp-service-account: rideshare-rider@metered-513804.iam.gserviceaccount.com
