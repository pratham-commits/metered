apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rideshare-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pratham-commits/metered.git
    targetRevision: main
    path: deploy/platform
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
