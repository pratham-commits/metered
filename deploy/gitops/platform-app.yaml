apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rideshare-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pratham-commits/metered.git
    targetRevision: gcp-migration
    path: deploy/platform
    directory:
      recurse: true
      # Person 2 replaces the *.yaml.stub files with real manifests, then removes
      # this exclude (or narrows it) so Argo CD syncs Prometheus/Grafana.
      exclude: "{*.stub,.gitkeep,README.md}"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
