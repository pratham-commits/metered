apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rideshare
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pratham-commits/metered.git
    targetRevision: main
    path: deploy/apps
    directory:
      recurse: true
      include: "{migrate/job.yaml,rider/deployment.yaml,driver/deployment.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: rideshare
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
