services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rideshare
      POSTGRES_PASSWORD: rideshare
      POSTGRES_DB: rideshare
    ports:
      - 5432:5432
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U rideshare
      interval: 5s
      timeout: 3s
      retries: 20

  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command:
      - gcloud
      - beta
      - emulators
      - firestore
      - start
      - --host-port=0.0.0.0:8080
      - --project=rideshare-local
    ports:
      - 8080:8080

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --host-port=0.0.0.0:8085
      - --project=rideshare-local
    ports:
      - 8085:8085

  gcs:
    image: fsouza/fake-gcs-server:1.52.2
    command:
      - -scheme
      - http
      - -port
      - "4443"
      - -backend
      - memory
      - -public-host
      - gcs:4443
    ports:
      - 4443:4443

  gcp-init:
    image: curlimages/curl:8.10.1
    depends_on:
      firestore:
        condition: service_started
      pubsub:
        condition: service_started
      gcs:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -s http://firestore:8080/ >/dev/null; do sleep 1; done
        until curl -s http://pubsub:8085/ >/dev/null; do sleep 1; done
        until curl -s "http://gcs:4443/storage/v1/b?project=rideshare-local" >/dev/null; do sleep 1; done
        curl -s -X PUT "http://pubsub:8085/v1/projects/rideshare-local/topics/rideshare-match-jobs" >/dev/null || true
        curl -s -X PUT "http://pubsub:8085/v1/projects/rideshare-local/topics/rideshare-match-jobs-dlq" >/dev/null || true
        curl -s -X PUT "http://pubsub:8085/v1/projects/rideshare-local/subscriptions/rideshare-match-jobs-sub" \
          -H "Content-Type: application/json" \
          -d '{"topic":"projects/rideshare-local/topics/rideshare-match-jobs"}' >/dev/null || true
        curl -s -X POST "http://gcs:4443/storage/v1/b?project=rideshare-local" \
          -H "Content-Type: application/json" \
          -d '{"name":"rideshare-trip-files-local"}' >/dev/null || true

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - 9092:9092
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      interval: 10s
      timeout: 10s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: services/rider/Dockerfile
    command:
      - python
      - -m
      - rideshare.migrate
    environment:
      DATABASE_URL: postgresql://rideshare:rideshare@postgres:5432/rideshare
    depends_on:
      postgres:
        condition: service_healthy

  rider:
    build:
      context: .
      dockerfile: services/rider/Dockerfile
    environment: &gcp-env
      DATABASE_URL: postgresql://rideshare:rideshare@postgres:5432/rideshare
      GCP_PROJECT: rideshare-local
      GOOGLE_CLOUD_PROJECT: rideshare-local
      STORAGE_BACKEND: gcp
      FIRESTORE_EMULATOR_HOST: firestore:8080
      PUBSUB_EMULATOR_HOST: pubsub:8085
      STORAGE_EMULATOR_HOST: http://gcs:4443
      FIRESTORE_DATABASE: (default)
      DRIVER_COLLECTION: rideshare_driver_live
      DEMAND_COLLECTION: rideshare_demand_windows
      TRIP_BUCKET: rideshare-trip-files-local
      MATCH_TOPIC: rideshare-match-jobs
      MATCH_SUBSCRIPTION: rideshare-match-jobs-sub
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_TOPIC_EVENTS: ride-events
      KAFKA_TOPIC_RESULTS: demand-results
      HASH_NODES: p0,p1,p2,p3
      H3_RESOLUTION: "8"
      H3_NEIGHBOR_K: "1"
      FARE_ESTIMATE_URL: ""
      DEMO_TOKEN: local-demo-token
      SERVICE_NAME: rider
    depends_on:
      migrate:
        condition: service_completed_successfully
      gcp-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    ports:
      - 127.0.0.1:8001:8001

  driver:
    build:
      context: .
      dockerfile: services/driver/Dockerfile
    environment:
      <<: *gcp-env
      SERVICE_NAME: driver
    depends_on:
      migrate:
        condition: service_completed_successfully
      gcp-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    ports:
      - 127.0.0.1:8002:8002
      - 127.0.0.1:9002:9002

